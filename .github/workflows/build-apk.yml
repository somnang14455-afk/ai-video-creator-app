name: Build AI Video Creator APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-dev \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install cython==0.29.36 buildozer

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure Android SDK for Buildozer
        shell: bash
        run: |
          set -euo pipefail

          REAL_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          REAL_SDKMANAGER="$(find "$REAL_SDK" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$REAL_SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            find "$REAL_SDK" -type f -name sdkmanager -print || true
            exit 1
          fi

          LEGACY_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$LEGACY_SDK/tools/bin"

          for item in platforms platform-tools build-tools cmdline-tools licenses; do
            if [ -e "$REAL_SDK/$item" ] && \
               [ ! -e "$LEGACY_SDK/$item" ] && \
               [ ! -L "$LEGACY_SDK/$item" ]; then
              ln -s "$REAL_SDK/$item" "$LEGACY_SDK/$item"
            fi
          done

          cat > "$LEGACY_SDK/tools/bin/sdkmanager" <<EOF
          #!/usr/bin/env bash
          exec "$REAL_SDKMANAGER" "\$@"
          EOF

          chmod +x "$LEGACY_SDK/tools/bin/sdkmanager"

          echo "ANDROID_HOME=$REAL_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$REAL_SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$LEGACY_SDK" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          yes | "$REAL_SDKMANAGER" --licenses || true

          echo "Android SDK: $REAL_SDK"
          echo "Buildozer SDK: $LEGACY_SDK"
          "$LEGACY_SDK/tools/bin/sdkmanager" --version

      - name: Verify Android SDK
        run: |
          set -eu
          test -x "$ANDROIDSDK/tools/bin/sdkmanager"
          test -x "$ANDROIDSDK/platform-tools/adb"
          "$ANDROIDSDK/tools/bin/sdkmanager" --version
          echo "Android SDK verification passed."

      - name: Build debug APK
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
          if-no-files-found: error
