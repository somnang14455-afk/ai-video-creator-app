name: Build AI Video Creator APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-dev \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            libltdl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install --upgrade cython==0.29.36 buildozer pvx

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          echo "### License" > ~/.android/repositories.cfg
          ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n24333f8a43b680d2304df263e18830495f16f5d4" >> $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a648b0" >> $ANDROID_HOME/licenses/android-sdk-license
      - name: Diagnose Android SDK Manager
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          echo "Checking SDK: $SDK"
          find "$SDK" -type f -name sdkmanager -print
          echo "Checking legacy path:"
          ls -l "$SDK/tools/bin/sdkmanager" || true
          echo "Checking command:"
          command -v sdkmanager || true
       
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Fix Buildozer SDK Manager Path
        run: |
          set -eu

          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK"

          # Find sdkmanager provided by the setup action
          FOUND="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$FOUND" ]; then
            echo "ERROR: sdkmanager was not installed"
            exit 1
          fi

          echo "Found sdkmanager: $FOUND"

          mkdir -p "$SDK/tools/bin"
          ln -sf "$FOUND" "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version

      
      
      - name: Fix Buildozer SDK Manager
        run: |
          set -eu

          SDK="$ANDROID_HOME"
          REAL_SDKMANAGER="$SDK/cmdline-tools/22.0/bin/sdkmanager"

          if [ ! -f "$REAL_SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found at $REAL_SDKMANAGER"
            find "$SDK/cmdline-tools" -type f -name sdkmanager -print
            exit 1
          fi

          mkdir -p "$SDK/tools/bin"

          cat > "$SDK/tools/bin/sdkmanager" <<'EOF'
          #!/usr/bin/env bash
          exec "$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager" "$@"
          EOF

          chmod +x "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version
          
      - name: Build debug APK
        env:
          USE_SDK_WRAPPER: "1"
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
          android.sdk_path = /usr/local/lib/android/sdk


